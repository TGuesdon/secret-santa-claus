name: Secret Santa

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Campaign operation
        type: choice
        options: [prepare, simulate, send, resolve]
        default: simulate
        required: true
      campaign:
        description: Campaign identifier (for example christmas-2026)
        type: string
        required: true
      confirmation:
        description: Repeat the exact campaign identifier for send or resolve
        type: string
      record:
        description: Opaque participant ID (resolve only; never paste a personal link)
        type: string
      status:
        description: Resolution after checking sent mail (resolve only)
        type: choice
        options: [pending, sent]
      message_id:
        description: Confirmed email Message-ID (resolve as sent only)
        type: string

permissions:
  contents: read

concurrency:
  group: santa-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.operation == 'prepare' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.saved.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Prepare or resume the durable campaign
        run: npm run santa:prepare -- --id "$CAMPAIGN_ID"
        env:
          CAMPAIGN_ID: ${{ inputs.campaign }}
          SANTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SANTA_PARTICIPANTS_JSON: ${{ secrets.SANTA_PARTICIPANTS_JSON }}
          SANTA_ARCHIVE_KEY: ${{ secrets.SANTA_ARCHIVE_KEY }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      - name: Verify the saved draw and build
        run: npm run ci
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      - id: saved
        name: Record the persisted commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Refuse to deploy an outdated campaign
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment

  simulate:
    if: inputs.operation == 'simulate' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run santa:mail -- --id "$CAMPAIGN_ID"
        env:
          CAMPAIGN_ID: ${{ inputs.campaign }}
          SANTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SANTA_ARCHIVE_KEY: ${{ secrets.SANTA_ARCHIVE_KEY }}
          SANTA_SENDER_EMAIL: ${{ vars.SANTA_SENDER_EMAIL }}
          SANTA_SENDER_NAME: ${{ vars.SANTA_SENDER_NAME }}

  deliver:
    if: inputs.operation == 'send' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Verify before enabling Gmail
        run: npm run ci
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      - name: Send pending emails only
        run: npm run santa:mail -- --id "$CAMPAIGN_ID" --send --confirm "$CONFIRMATION"
        env:
          CAMPAIGN_ID: ${{ inputs.campaign }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SANTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SANTA_ARCHIVE_KEY: ${{ secrets.SANTA_ARCHIVE_KEY }}
          SANTA_SENDER_EMAIL: ${{ vars.SANTA_SENDER_EMAIL }}
          SANTA_SENDER_NAME: ${{ vars.SANTA_SENDER_NAME }}
          GOOGLE_APPLICATION_PASSWORD: ${{ secrets.GOOGLE_APPLICATION_PASSWORD }}

  resolve:
    if: inputs.operation == 'resolve' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Apply the operator's resolution without sending
        run: >-
          npm run santa:resolve -- --id "$CAMPAIGN_ID" --confirm "$CONFIRMATION"
          --record "$RECORD_ID" --status "$DELIVERY_STATUS" --message-id "$MESSAGE_ID"
        env:
          CAMPAIGN_ID: ${{ inputs.campaign }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RECORD_ID: ${{ inputs.record }}
          DELIVERY_STATUS: ${{ inputs.status }}
          MESSAGE_ID: ${{ inputs.message_id }}
          SANTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SANTA_ARCHIVE_KEY: ${{ secrets.SANTA_ARCHIVE_KEY }}
