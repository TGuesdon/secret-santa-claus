name: Secret Santa complete campaign

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign identifier (for example christmas-2026)
        type: string
        required: true
      confirmation:
        description: Repeat the exact campaign identifier to authorize real email delivery
        type: string
        required: true

permissions:
  contents: read

# Use the same lock as individual operations and Pages deployments.
concurrency:
  group: santa-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-and-simulate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.saved.outputs.sha }}
    steps:
      - name: Require confirmation before changing campaign state
        env:
          CAMPAIGN_ID: ${{ inputs.campaign }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test -n "$CAMPAIGN_ID" && test "$CAMPAIGN_ID" = "$CONFIRMATION"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Prepare or resume the durable campaign
        run: npm run santa:prepare -- --id "$CAMPAIGN_ID"
        env:
          CAMPAIGN_ID: ${{ inputs.campaign }}
          SANTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SANTA_PARTICIPANTS_JSON: ${{ secrets.SANTA_PARTICIPANTS_JSON }}
          SANTA_ARCHIVE_KEY: ${{ secrets.SANTA_ARCHIVE_KEY }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      - name: Simulate delivery without Gmail credentials
        run: npm run santa:mail -- --id "$CAMPAIGN_ID"
        env:
          CAMPAIGN_ID: ${{ inputs.campaign }}
          SANTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SANTA_ARCHIVE_KEY: ${{ secrets.SANTA_ARCHIVE_KEY }}
          SANTA_SENDER_EMAIL: ${{ vars.SANTA_SENDER_EMAIL }}
          SANTA_SENDER_NAME: ${{ vars.SANTA_SENDER_NAME }}
      - name: Verify the saved draw and build
        run: npm run ci
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      - id: saved
        name: Record the persisted commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: prepare-and-simulate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Refuse to deploy an outdated campaign
        env:
          EXPECTED_SHA: ${{ needs.prepare-and-simulate.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment

  deliver:
    needs: [prepare-and-simulate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refuse campaign changes after verification
        env:
          EXPECTED_SHA: ${{ needs.prepare-and-simulate.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Wait for the exact published draw before enabling Gmail
        env:
          CAMPAIGN_ID: ${{ inputs.campaign }}
          SANTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SANTA_ARCHIVE_KEY: ${{ secrets.SANTA_ARCHIVE_KEY }}
        run: |
          for attempt in {1..12}; do
            if npm run santa:check -- --id "$CAMPAIGN_ID" --published; then
              exit 0
            fi
            sleep 5
          done
          echo "The saved campaign is not available on Pages. No emails sent."
          exit 1
      - name: Send pending emails only
        run: npm run santa:mail -- --id "$CAMPAIGN_ID" --send --confirm "$CONFIRMATION"
        env:
          CAMPAIGN_ID: ${{ inputs.campaign }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SANTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SANTA_ARCHIVE_KEY: ${{ secrets.SANTA_ARCHIVE_KEY }}
          SANTA_SENDER_EMAIL: ${{ vars.SANTA_SENDER_EMAIL }}
          SANTA_SENDER_NAME: ${{ vars.SANTA_SENDER_NAME }}
          GOOGLE_APPLICATION_PASSWORD: ${{ secrets.GOOGLE_APPLICATION_PASSWORD }}
